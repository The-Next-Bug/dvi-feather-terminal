# Build the DVI terminal firmware with pico-sdk + CMake.
#
# Jobs run in registry.seg9.com/images/build-image (gitlab.seg9.com:
# images/build-image), which carries the toolchain (CMake, Arm GNU Toolchain,
# picotool) in /opt/pico-toolchain at the versions pinned in toolchain.env.
# scripts/setup-toolchain.sh still runs: it finds them installed and only
# prints their versions. After a change to toolchain.env, update the image's
# Dockerfile ARGs to match; until then each job downloads the new versions.
# pico-sdk is a pinned submodule; z80pack is vendored (lib/z80pack).

# Branch and tag pipelines only. A merge request shows its branch's pipeline;
# a separate MR pipeline would drop the rule-less test/build jobs and leave
# package's needs unsatisfied.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

stages:
  - test
  - build
  - package
  - release

variables:
  GIT_DEPTH: "0"  # full history so git describe works in build-info.txt
  # Top-level submodules only: of pico-sdk's own, just TinyUSB is needed and
  # the build job fetches it (the rest, lwIP, mbedtls, btstack, ... are big).
  GIT_SUBMODULE_STRATEGY: normal
  GIT_SUBMODULE_DEPTH: "1"
  TOOLCHAIN_DIR: /opt/pico-toolchain

.image:
  image: registry.seg9.com/images/build-image:latest
  before_script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"

# Host unit tests for the portable code; needs only CMake (and z80pack's
# disk images, vendored in lib/z80pack). Then clang-tidy (scripts/lint.sh)
# over the tests' build; each build job lints its target's.
test:
  extends: .image
  stage: test
  script:
    - scripts/setup-toolchain.sh cmake clang-tidy
    - scripts/test.sh
    - scripts/lint.sh build/test
  artifacts:
    when: always
    reports:
      junit: build/test/junit.xml

build:
  extends: .image
  stage: build
  needs: []
  parallel:
    matrix:
      - TARGET: [pico2-dvi-sock, frankless, feather-rp2350-hstx, feather-rp2350-hstx-psram,
                 feather-rp2350-hstx-adalogger, feather-rp2350-hstx-psram-adalogger]
  script:
    - git -C lib/pico-sdk submodule update --init --depth 1 lib/tinyusb
    - scripts/setup-toolchain.sh
    - BUILD_DIR=build scripts/build.sh
    - scripts/lint.sh build/$TARGET
  artifacts:
    name: "dvi-terminal-$TARGET-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/$TARGET/dvi_terminal.uf2
      - build/$TARGET/hstx_test.uf2
      - build/$TARGET/dvi_terminal.bin
      - build/$TARGET/dvi_terminal.elf
      - build/$TARGET/dvi_terminal.dis
      - build/$TARGET/dvi_terminal.elf.map
      - build/$TARGET/build-info.txt
      - build/$TARGET/compile.log
    expire_in: 30 days

package:
  extends: .image
  stage: package
  needs: [test, build]
  script:
    # For TinyUSB's license text, which the package ships.
    - git -C lib/pico-sdk submodule update --init --depth 1 lib/tinyusb
    - BUILD_DIR=build DIST_DIR=dist scripts/package.sh
  artifacts:
    name: "dvi-terminal-$CI_COMMIT_REF_SLUG"
    paths:
      - dist/*.zip
      - dist/CHANGES.md
    expire_in: 90 days
  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when: manual
      allow_failure: true

# Tagged builds only: store the package permanently in the project's generic
# package registry and create a GitLab Release that links to it, with
# CHANGES.md (commit history since the previous tag) as the description.
release:
  # GitLab 17.x: the release keyword is handled by release-cli (glab is 18.x+).
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  stage: release
  needs: [package]
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    GIT_SUBMODULE_STRATEGY: none
    PACKAGE_URL: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/dvi-terminal/$CI_COMMIT_TAG"
  script:
    - command -v curl >/dev/null || apk add --no-cache curl >/dev/null
    - |
      curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file "dist/dvi-terminal-$CI_COMMIT_TAG.zip" \
        "$PACKAGE_URL/dvi-terminal-$CI_COMMIT_TAG.zip"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "$CI_COMMIT_TAG"
    description: "dist/CHANGES.md"
    assets:
      links:
        - name: "dvi-terminal-$CI_COMMIT_TAG.zip (UF2 + BIN + source)"
          url: "$PACKAGE_URL/dvi-terminal-$CI_COMMIT_TAG.zip"
          link_type: package
